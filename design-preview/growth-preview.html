<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一企推推乐 · 增长设计原型</title>
<style>
  :root{
    --cream:#FFF9EE; --paper:#FFFFFF;
    --water:#5BC8F5; --waterDeep:#2C9CD6;
    --navy:#1F3A5F; --navyDeep:#152A45; --navySoft:#4A6B8C;
    --pink:#FF7FB0; --pinkDeep:#E85F97;
    --mint:#2FBF9B; --mintDeep:#1FA383;
    --lavender:#A78BFA; --lavenderDeep:#8B6BE8;
    --yellow:#FFC94A; --yellowDeep:#E5A72B; --yellowInk:#B98A12;
    --orange:#FF9F5A; --orangeDeep:#E07C36;
    --coral:#FF7A6B;
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0E1620;color:#DCE7F2;font-family:var(--font);padding:28px 24px 60px;min-height:100vh}
  header{max-width:1120px;margin:0 auto 18px}
  h1{font-size:20px;letter-spacing:.5px}
  h1 span{color:var(--mint)}
  .sub{color:#7A8FA4;font-size:12.5px;margin-top:6px;line-height:1.6}
  nav{max-width:1120px;margin:18px auto 22px;display:flex;gap:8px;flex-wrap:wrap}
  nav button{font-family:var(--font);font-size:13px;font-weight:700;color:#8FA6B8;background:#16222E;border:1px solid #22323F;
    border-radius:999px;padding:9px 16px;cursor:pointer;transition:.15s}
  nav button:hover{color:#DCE7F2;border-color:#385166}
  nav button.on{background:var(--mint);color:#062B22;border-color:var(--mint)}

  .stage{max-width:1120px;margin:0 auto;display:flex;gap:36px;align-items:flex-start}
  .phone-wrap{flex:0 0 auto}
  .notes{flex:1;min-width:280px;padding-top:8px}
  .notes h2{font-size:15px;margin-bottom:12px;color:#EAF2FA}
  .notes h3{font-size:12px;color:var(--mint);letter-spacing:.4px;margin:18px 0 6px}
  .notes p,.notes li{font-size:13px;line-height:1.75;color:#93A8BC}
  .notes ul{list-style:none}
  .notes li{padding-left:14px;position:relative;margin-bottom:2px}
  .notes li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#3A5468}
  .notes b{color:#DCE7F2;font-weight:700}
  .notes code{background:#16222E;padding:1px 5px;border-radius:4px;font-size:12px;color:#8FD3C0}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:5px;vertical-align:1px}
  .tag.new{background:rgba(47,191,155,.16);color:#5FD9B9}
  .tag.fix{background:rgba(255,201,74,.14);color:#FFC94A}
  .tag.warn{background:rgba(255,122,107,.14);color:#FF9E93}

  /* ---------- 手机屏 ---------- */
  .phone{position:relative;width:375px;height:667px;border-radius:26px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);font-family:var(--font);user-select:none}
  .ocean{background:linear-gradient(180deg,#C9F4FF 0%,#7FD8F7 45%,#2C9CD6 100%)}
  .glass{position:absolute;inset:0 0 auto;height:34%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
  .sand{position:absolute;left:-10%;right:-10%;bottom:-40px;height:110px;border-radius:50% 50% 0 0/40px;
    background:radial-gradient(120% 100% at 50% 0%,#FBEBCE 0%,#F0D9B0 55%,#E4C391 100%);
    box-shadow:inset 0 6px 14px rgba(255,255,255,.7)}
  .bubble{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);pointer-events:none}

  .sticker{font-weight:900;color:#fff;letter-spacing:1px;
    text-shadow:-1.5px -1.5px 0 var(--navyDeep),0 -1.5px 0 var(--navyDeep),1.5px -1.5px 0 var(--navyDeep),-1.5px 0 0 var(--navyDeep),1.5px 0 0 var(--navyDeep),-1.5px 1.5px 0 var(--navyDeep),0 1.5px 0 var(--navyDeep),1.5px 1.5px 0 var(--navyDeep)}
  .sticker-thin{font-weight:800;color:#fff;
    text-shadow:-1px -1px 0 rgba(21,42,69,.95),0 -1px 0 rgba(21,42,69,.95),1px -1px 0 rgba(21,42,69,.95),-1px 0 0 rgba(21,42,69,.95),1px 0 0 rgba(21,42,69,.95),-1px 1px 0 rgba(21,42,69,.95),0 1px 0 rgba(21,42,69,.95),1px 1px 0 rgba(21,42,69,.95)}

  .candy{position:relative;border:none;border-radius:999px;font-family:var(--font);font-weight:800;color:#fff;cursor:pointer;white-space:nowrap;
    background:linear-gradient(180deg,var(--mint) 0%,var(--mintDeep) 100%);
    box-shadow:0 4px 0 #17876C,0 2px 6px rgba(21,42,69,.18);text-shadow:0 1px 0 rgba(21,42,69,.18)}
  .candy::after{content:"";position:absolute;left:7px;right:7px;top:5px;height:34%;border-radius:999px;background:rgba(255,255,255,.4);pointer-events:none}
  .candy.water{background:linear-gradient(180deg,var(--water),var(--waterDeep));box-shadow:0 4px 0 #1F7FAE,0 2px 6px rgba(21,42,69,.18)}
  .candy.lav{background:linear-gradient(180deg,var(--lavender),var(--lavenderDeep));box-shadow:0 4px 0 #7255CC,0 2px 6px rgba(21,42,69,.18)}
  .candy.yel{background:linear-gradient(180deg,var(--yellow),var(--yellowDeep));box-shadow:0 4px 0 #B8861C,0 2px 6px rgba(21,42,69,.18)}
  .candy.pink{background:linear-gradient(180deg,var(--pink),var(--pinkDeep));box-shadow:0 4px 0 #CE4D80,0 2px 6px rgba(21,42,69,.18)}
  .candy.orange{background:linear-gradient(180deg,var(--orange),var(--orangeDeep));box-shadow:0 4px 0 #C1651F,0 2px 6px rgba(21,42,69,.18)}

  /* 弹窗容器：铺满 375×667，内部一律用设计稿坐标 */
  .overlay{position:absolute;inset:0;background:rgba(8,22,38,.62);z-index:1}
  .pwrap{position:absolute;inset:0;z-index:2}
  .panel{position:absolute;background:rgba(255,249,238,.97);border:2px solid rgba(255,255,255,.95);border-radius:30px;
    box-shadow:0 6px 0 rgba(31,58,95,.10),0 18px 54px rgba(31,58,95,.42);overflow:hidden;z-index:0}
  .panel::before{content:"";position:absolute;left:3px;right:3px;top:3px;height:46%;border-radius:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}

  /* ---------- 首页 ---------- */
  .float{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.95);
    background:linear-gradient(180deg,#FFFFFF,#EAF9FF);display:grid;place-items:center;cursor:pointer;
    box-shadow:0 4px 0 rgba(31,58,95,.18),0 6px 16px rgba(31,58,95,.2);font-size:19px;z-index:3}
  .float.left{left:16px;top:26px}
  .float.right{right:16px;top:26px}
  .float .dot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid #fff}
  .float .streak{position:absolute;right:-10px;bottom:-4px;background:linear-gradient(180deg,#FFD873,#E5A72B);color:#5C4408;
    font-size:9.5px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;white-space:nowrap;border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(21,42,69,.25)}
  .float .coin{position:absolute;right:-8px;bottom:-4px;background:linear-gradient(180deg,#7FD4F5,#2C9CD6);color:#fff;
    font-size:10px;font-weight:800;padding:2px 6px;border-radius:9px;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(21,42,69,.3)}
  .title-wrap{position:absolute;left:0;right:0;top:92px;text-align:center}
  .title{font-size:50px;line-height:1}
  .sub-pill{display:inline-block;margin-top:12px;padding:5px 18px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:1px;
    color:#fff;background:linear-gradient(180deg,var(--water),var(--waterDeep));box-shadow:0 3px 0 #1F7FAE;text-shadow:0 1px 2px rgba(21,42,69,.4)}
  .challenge{position:absolute;left:27px;top:461px;width:321px;height:36px;border-radius:18px;display:flex;align-items:center;
    padding:0 4px 0 13px;gap:8px;background:rgba(255,255,255,.85);border:1.5px solid rgba(47,191,155,.55);box-shadow:0 3px 10px rgba(31,58,95,.14)}
  .challenge .who{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap}
  .challenge .who em{font-style:normal;color:var(--mintDeep)}
  .challenge .go{margin-left:auto;font-size:11.5px;font-weight:800;color:#fff;padding:6px 13px;border-radius:999px;
    background:linear-gradient(180deg,var(--mint),var(--mintDeep));box-shadow:0 3px 0 #17876C}
  .penguin-stage{position:absolute;left:50%;top:210px;transform:translateX(-50%)}
  .penguin-stage .shadow{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:132px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9)}
  .btn-main{position:absolute;left:77px;top:392px;width:221px;height:62px;font-size:20px;letter-spacing:1px}
  .progress{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:12px}
  .sub-grid{position:absolute;left:75px;top:500px;width:225px;display:grid;grid-template-columns:104px 104px;gap:12px 16px}
  .sub-grid .candy{height:46px;font-size:16px;border-radius:23px}
  .hint{position:absolute;left:0;right:0;top:628px;text-align:center;font-size:12.5px}

  /* ---------- 结算 ---------- */
  .ribbon{position:absolute;left:87.5px;top:92px;width:200px;height:46px;border-radius:23px;display:grid;place-items:center;
    background:linear-gradient(180deg,var(--mint),var(--mintDeep));box-shadow:0 4px 0 #17876C}
  .ribbon::before,.ribbon::after{content:"";position:absolute;top:8px;width:0;height:0;border-top:15px solid transparent;border-bottom:15px solid transparent}
  .ribbon::before{left:-18px;border-right:18px solid var(--mintDeep)}
  .ribbon::after{right:-18px;border-left:18px solid var(--mintDeep)}
  .ribbon span{font-size:29px;font-weight:900;color:#fff;
    text-shadow:-1.5px -1.5px 0 var(--navyDeep),0 -1.5px 0 var(--navyDeep),1.5px -1.5px 0 var(--navyDeep),-1.5px 0 0 var(--navyDeep),1.5px 0 0 var(--navyDeep),-1.5px 1.5px 0 var(--navyDeep),0 1.5px 0 var(--navyDeep),1.5px 1.5px 0 var(--navyDeep)}
  .badge{position:absolute;left:50%;transform:translateX(-50%);top:158px;height:24px;padding:0 18px;border-radius:12px;
    display:grid;place-items:center;width:max-content;background:linear-gradient(180deg,var(--water),var(--waterDeep));
    box-shadow:0 3px 0 #1F7FAE;font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 1px 1px rgba(21,42,69,.3)}
  .stars{position:absolute;left:0;right:0;top:214px;display:flex;justify-content:center;align-items:center;gap:14px}
  .star{width:44px;height:44px;position:relative}
  .star.on::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:rgba(255,201,74,.16)}
  .card{position:absolute;left:38px;top:254px;width:299px;height:92px;border-radius:18px;
    background:rgba(255,201,74,.20);border:1.5px solid rgba(229,167,43,.55)}
  .card .p{position:absolute;left:8px;top:12px}
  .card .l1{position:absolute;left:76px;top:14px;font-size:12px;color:var(--navySoft);font-weight:700;white-space:nowrap}
  .card .l1 b{font-size:16px;color:var(--coral)}
  .card .l2{position:absolute;left:76px;top:38px;font-size:15px;font-weight:800;color:var(--yellowInk);white-space:nowrap}
  .card .l3{position:absolute;left:76px;top:61px;font-size:12.5px;font-weight:800;color:var(--mintDeep);
    display:flex;align-items:center;gap:5px;white-space:nowrap}
  .card .l3 .pin{font-size:9px;background:var(--mint);color:#fff;border-radius:5px;padding:1.5px 4px;font-weight:800;flex:none}
  .reward{position:absolute;left:50%;transform:translateX(-50%);top:364px;height:38px;padding:0 16px;border-radius:19px;
    display:flex;align-items:center;gap:11px;width:max-content;
    background:rgba(47,191,155,.22);border:1.5px solid rgba(47,191,155,.45)}
  .reward .num{font-size:16px;font-weight:800;color:var(--mintDeep);white-space:nowrap}
  .reward .sep{width:1px;height:16px;background:rgba(47,191,155,.35);flex:none}
  .reward .tagline{font-size:11px;color:var(--navySoft);font-weight:600;white-space:nowrap}
  .btn-primary{position:absolute;left:55px;top:422px;width:265px;height:46px;font-size:18px}
  .btn-row{position:absolute;left:55px;top:476px;width:265px;display:flex;gap:9px}
  .btn-row .candy{flex:1;height:46px;font-size:18px}
  .ach{position:absolute;left:55px;top:534px;width:265px;display:flex;flex-direction:column;gap:4px}
  .ach div{height:25px;border-radius:13px;background:rgba(255,201,74,.18);display:flex;align-items:center;padding:0 12px;gap:7px;
    font-size:12px;font-weight:700;color:var(--navy)}
  .ach .r{margin-left:auto;font-size:11px;color:var(--yellowInk)}
  .callout{position:absolute;border:1.5px dashed var(--coral);border-radius:10px;pointer-events:none;z-index:3}

  /* ---------- 失败 ---------- */
  .over-title{position:absolute;left:0;right:0;top:266px;text-align:center;font-size:33px;font-weight:900;letter-spacing:2px;color:var(--coral)}
  .over-sub{position:absolute;left:0;right:0;top:319px;text-align:center;font-size:15px;font-weight:700;color:var(--navy)}
  .over-tip{position:absolute;left:0;right:0;top:346px;text-align:center;font-size:12.5px;font-weight:800;color:var(--mintDeep)}
  .over-ad{position:absolute;left:0;right:0;top:388px;text-align:center;font-size:12.5px;font-weight:700;color:var(--yellowInk)}
  .over-btn{position:absolute;left:87px;width:201px;height:50px;font-size:19px}

  /* ---------- 签到 ---------- */
  .ck-head{position:absolute;left:0;right:0;text-align:center}
  .ck-head h3{font-size:22px;color:var(--navy);letter-spacing:1px}
  .ck-head p{margin-top:6px;font-size:12px;color:var(--navySoft);font-weight:600}
  .ck-grid{position:absolute;left:52px;top:174px;width:271px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .ck-cell{height:62px;border-radius:14px;background:#fff;border:1.5px solid rgba(31,58,95,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
  .ck-cell .d{font-size:9.5px;font-weight:800;color:#9AAEC0;letter-spacing:.5px}
  .ck-cell .v{font-size:13px;font-weight:900;color:var(--navy)}
  .ck-cell.done{background:rgba(47,191,155,.14);border-color:rgba(47,191,155,.4)}
  .ck-cell.done .v{color:var(--mintDeep)}
  .ck-cell.today{background:linear-gradient(180deg,#FFF6DC,#FFEFC4);border-color:var(--yellowDeep);box-shadow:0 3px 10px rgba(229,167,43,.25)}
  .ck-cell .check{position:absolute;right:5px;top:4px;font-size:10px;color:var(--mintDeep);font-weight:900}
  .ck-big{position:absolute;left:52px;top:340px;width:271px;height:96px;border-radius:16px;
    background:linear-gradient(135deg,#F3E9FF 0%,#FFE8F2 100%);border:1.5px solid rgba(139,107,232,.35);
    display:flex;align-items:center;padding:0 10px 0 14px;gap:8px;overflow:hidden}
  .ck-big .d7{font-size:9.5px;font-weight:900;color:#8B6BE8;letter-spacing:.5px}
  .ck-big .name{font-size:14px;font-weight:900;color:var(--navy);margin-top:3px;white-space:nowrap}
  .ck-big .extra{font-size:11px;font-weight:700;color:var(--lavenderDeep);margin-top:5px}
  .ck-btn{position:absolute;left:74px;top:452px;width:227px;height:50px;font-size:17px}
  .ck-note{position:absolute;left:0;right:0;top:512px;text-align:center;font-size:11px;color:var(--navySoft);font-weight:600}

  /* ---------- 商城 ---------- */
  .shop-head{position:absolute;left:34px;right:34px;top:82px;display:flex;align-items:center}
  .shop-head h3{font-size:19px;color:var(--navy);letter-spacing:1px}
  .wallet{margin-left:auto;display:flex;align-items:center;gap:5px;background:rgba(91,200,245,.16);
    border:1.5px solid rgba(44,156,214,.35);border-radius:999px;padding:4px 11px 4px 8px}
  .wallet .ic{font-size:13px;color:#2C9CD6}
  .wallet .n{font-size:15px;font-weight:900;color:var(--waterDeep)}
  .ad-btn{position:absolute;right:34px;top:120px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
    color:#7A5E10;background:rgba(255,201,74,.28);border:1.2px solid rgba(229,167,43,.5);border-radius:999px;padding:5px 10px}
  .tabs2{position:absolute;left:34px;right:34px;top:158px;display:flex;gap:7px}
  .tabs2 span{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:7px 0;border-radius:999px;color:var(--navySoft);background:rgba(31,58,95,.06)}
  .tabs2 span.on{background:var(--navy);color:#fff;box-shadow:0 3px 0 rgba(21,42,69,.5)}
  .shop-grid{position:absolute;left:34px;top:202px;width:307px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .item{height:158px;border-radius:18px;background:#fff;border:1.5px solid rgba(31,58,95,.09);position:relative;
    display:flex;flex-direction:column;align-items:center;padding-top:8px;box-shadow:0 3px 8px rgba(31,58,95,.06)}
  .item .pv{height:82px;display:grid;place-items:center;position:relative}
  .item .nm{font-size:12.5px;font-weight:800;color:var(--navy);margin-top:2px}
  .item .buy{position:absolute;bottom:9px;left:12px;right:12px;height:30px;border-radius:15px;font-size:12.5px;font-weight:800;
    display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,var(--water),var(--waterDeep));box-shadow:0 3px 0 #1F7FAE}
  .item .buy.owned{background:rgba(47,191,155,.16);color:var(--mintDeep);box-shadow:none;border:1.5px solid rgba(47,191,155,.45)}
  .item .buy.equipped{background:linear-gradient(180deg,var(--mint),var(--mintDeep));box-shadow:0 3px 0 #17876C}
  .item .flag{position:absolute;left:-1px;top:-1px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;
    padding:3px 8px;border-radius:16px 0 12px 0;z-index:2}
  .shop-more{position:absolute;left:34px;top:540px;width:307px;height:54px;border-radius:16px;
    border:1.5px dashed rgba(31,58,95,.18);display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;font-weight:700;color:#9AAEC0;background:rgba(255,255,255,.5)}
  .shop-foot{position:absolute;left:34px;right:34px;bottom:37px;font-size:10.5px;color:#9AAEC0;text-align:center;line-height:1.5}

  .legend{max-width:1120px;margin:34px auto 0;font-size:12px;color:#6F8598;line-height:1.9}
  .legend b{color:#A9BCCC}
  .legend code{background:#16222E;padding:1px 5px;border-radius:4px;font-size:11.5px;color:#8FD3C0}
  @media (max-width:900px){ .stage{flex-direction:column} .notes{width:100%} }
</style>
</head>
<body>

<header>
  <h1>一企推推乐 · 增长设计<span>原型</span></h1>
  <p class="sub">375×667 设计稿 1:1 还原，配色与控件样式取自 <code>js/ui/theme.js</code>。五屏对应 <code>docs/GROWTH.md</code> 的模块 A~D。</p>
</header>

<nav>
  <button class="on" data-tab="home">① 首页 · 入口</button>
  <button data-tab="result">② 结算 · 个人对比</button>
  <button data-tab="over">③ 失败 · 提示券</button>
  <button data-tab="checkin">④ 签到 · 7 日</button>
  <button data-tab="shop">⑤ 商城 · 外观</button>
</nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="penguin">
      <ellipse cx="0" cy="25" rx="15" ry="3.8" fill="rgba(31,58,95,.16)"/>
      <ellipse cx="-9.8" cy="21.6" rx="2.6" ry="1.9" fill="#FF9F5A" transform="rotate(7,-9.8,21.6)"/>
      <ellipse cx="-6.8" cy="22.5" rx="2.8" ry="2.1" fill="#FF9F5A"/>
      <ellipse cx="-3.8" cy="21.6" rx="2.6" ry="1.9" fill="#FF9F5A" transform="rotate(-7,-3.8,21.6)"/>
      <ellipse cx="9.8" cy="21.6" rx="2.6" ry="1.9" fill="#FF9F5A" transform="rotate(-7,9.8,21.6)"/>

        <li>活跃玩家 3~5 天添一件，长期由 200 关首通兜底</li>
      </ul>

      <h3>换肤的红线</h3>
      <ul>
        <li><span class="tag warn">不做</span>冰块换色 —— 蓝色是它唯一的识别特征</li>
        <li><span class="tag warn">不做</span>目标区换色 —— 必须暖色 <code>R&gt;G&gt;B</code>，回归测试会查</li>
        <li><span class="tag warn">不做</span>企鹅围巾换色 —— 必须黄色，与橙喙同色系，这是形象识别</li>
        <li>能换的只有：头顶/眼部/颈部配件、目标区托盘形状、水体渐变</li>
      </ul>

      <h3>广告位没开通时</h3>
      <p><code>AD_UNITS.rewardedVideo</code> 现在是空的，所以「看广告 +10」整颗按钮要<b>隐藏</b>，不留灰色死按钮 —— 与现有 <code>promptInsufficientFood()</code> 的判断保持一致。每日 3 次是硬上限。</p>
    `
  }
};

const phone = document.getElementById('phone');
const notes = document.getElementById('notes');

function render(key){
  const s = screens[key];
  phone.innerHTML = s.html;
  notes.innerHTML = s.notes;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===key));
}

document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>render(btn.dataset.tab));
});

render('home');
</script>
