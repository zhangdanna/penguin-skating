<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企鹅滑冰 - 本地预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    h1 {
      flex: 0 0 auto;
      color: #fff;
      font-size: 18px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      border: 3px solid #4a90e2;
      border-radius: 12px;
      background: #87ceeb;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐧 企鹅滑冰</h1>
    <div class="stage">
      <canvas id="gameCanvas" width="375" height="667"></canvas>
    </div>
  </div>
  
  <script type="module">
    console.log('📄 HTML模块脚本开始执行');
    import '/local-preview/game-wrapper.js';
    console.log('✅ game-wrapper.js 导入完成');
  </script>
</body>
</html>
