<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企鹅滑冰 - 本地预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    
    #gameCanvas {
      border: 4px solid #4a90e2;
      border-radius: 12px;
      background: #87ceeb;
      display: block;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    
    .info {
      margin-top: 20px;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .controls {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }
    
    .controls strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐧 企鹅滑冰</h1>
    <div class="subtitle">本地Web预览版本</div>
    <canvas id="gameCanvas" width="375" height="667"></canvas>
    <div class="info">
      <div class="controls">
        <strong>操作说明：</strong><br>
        滑动一次移动一格 · 推动石头到目标区域
      </div>
    </div>
  </div>
  
  <script type="module">
    console.log('📄 HTML模块脚本开始执行');
    import '/local-preview/game-wrapper.js';
    console.log('✅ game-wrapper.js 导入完成');
  </script>
</body>
</html>
